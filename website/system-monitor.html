<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系統監看</title>
  <script src="i18n.js"></script>
  <style>
    :root {
      --bg: #fafafa;
      --panel: #fff;
      --surface: #f4f4f4;
      --line: #dedede;
      --line-soft: #ececec;
      --text: #181818;
      --muted: #737373;
      --blue: #216e9f;
      --magenta: #b84469;
      --green: #2e865f;
      --amber: #b07820;
      --cyan: #247b86;
      --red: #a33a3a;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar, .table-wrap::-webkit-scrollbar { display: none; }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page {
      width: min(1240px, calc(100vw - 48px));
      margin: 34px auto 48px;
    }
    .hero {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .eyebrow {
      color: #999;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 7px;
    }
    h1 { margin: 0 0 7px; font-size: 27px; line-height: 1.15; letter-spacing: 0; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }
    .icon-button {
      width: 40px;
      height: 40px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: #333;
    }
    .icon-button:hover:not(:disabled) { border-color: #aaa; background: #f6f6f6; }
    .icon-button:disabled { opacity: .4; cursor: default; }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }
    .tab {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #555;
      font-weight: 700;
    }
    .tab.active { color: #111; border-bottom-color: #111; }

    .panel {
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }
    .toolbar {
      min-height: 92px;
      padding: 16px 18px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }
    .toolbar-fields { display: flex; align-items: end; gap: 10px; flex-wrap: wrap; }
    .field { display: grid; gap: 7px; }
    .field label { font-size: 12px; font-weight: 750; color: #555; }
    select, input[type="date"] {
      height: 40px;
      min-width: 128px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      padding: 0 12px;
    }
    input[type="date"] { min-width: 190px; }
    .date-control { display: flex; gap: 8px; align-items: center; }
    .toolbar-status { color: var(--muted); font-size: 12px; text-align: right; line-height: 1.6; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      padding: 14px 16px;
      background: #fbfbfb;
      border-bottom: 1px solid var(--line);
    }
    .summary-card {
      min-width: 0;
      min-height: 104px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }
    .summary-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #555;
      font-size: 12px;
      font-weight: 750;
    }
    .summary-value {
      margin-top: 9px;
      font-size: 27px;
      line-height: 1;
      font-weight: 800;
      white-space: nowrap;
    }
    .summary-note {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 16px;
      background: #fbfbfb;
    }
    .chart-section {
      min-width: 0;
      padding: 19px 18px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }
    .chart-heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 10px;
    }
    .chart-title { font-size: 14px; font-weight: 800; }
    .chart-note { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .legend { display: flex; align-items: center; gap: 14px; color: #555; font-size: 11px; }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    .legend-dot { width: 9px; height: 9px; border-radius: 2px; background: currentColor; }
    .legend-item.off { color: #aaa !important; }
    .legend-item.off .legend-dot { background: transparent; border: 1px solid currentColor; }
    .chart-wrap { position: relative; width: 100%; height: 220px; }
    .chart-wrap canvas { display: block; width: 100%; height: 100%; }
    .chart-empty {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      color: #aaa;
      font-size: 13px;
      pointer-events: none;
    }
    .chart-empty.visible { display: grid; }

    .details-view { display: none; }
    .details-view.active, .resources-view.active { display: block; }
    .resources-view { display: none; }
    .details-actions { display: flex; justify-content: flex-end; margin-bottom: 14px; }
    .details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .details-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }
    .details-card.wide { grid-column: 1 / -1; }
    .details-card-header {
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      font-size: 13px;
      font-weight: 800;
    }
    .kv-list { padding: 8px 16px; }
    .kv-row {
      min-height: 36px;
      display: grid;
      grid-template-columns: minmax(110px, .8fr) minmax(0, 1.4fr);
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--line-soft);
      font-size: 12px;
    }
    .kv-row:last-child { border-bottom: 0; }
    .kv-key { color: var(--muted); }
    .kv-value { min-width: 0; text-align: right; font-weight: 650; overflow-wrap: anywhere; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); text-align: left; white-space: nowrap; }
    th { background: #fafafa; color: #666; font-weight: 750; }
    tbody tr:last-child td { border-bottom: 0; }
    .empty-row { color: #999; text-align: center; padding: 28px; }

    .loading-mask {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      background: rgba(250, 250, 250, .72);
      backdrop-filter: blur(2px);
    }
    .loading-mask.visible { display: grid; }
    .loading-box {
      min-width: 190px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 14px 32px rgba(0, 0, 0, .09);
      font-size: 13px;
      font-weight: 700;
    }
    .spinner {
      width: 21px;
      height: 21px;
      border: 3px solid #ddd;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-banner {
      display: none;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid #e4bcbc;
      border-radius: var(--radius);
      background: #fff7f7;
      color: var(--red);
      font-size: 12px;
    }
    .error-banner.visible { display: block; }

    @media (max-width: 1050px) {
      .summary-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .page { width: min(100% - 24px, 680px); margin-top: 22px; }
      .hero, .toolbar { align-items: stretch; flex-direction: column; }
      .toolbar-status { text-align: left; }
      .summary-grid, .details-grid, .chart-grid { grid-template-columns: 1fr; }
      .details-card.wide { grid-column: auto; }
      .chart-wrap { height: 190px; }
      .summary-card { min-height: 92px; }
      .summary-value { font-size: 23px; }
    }
  </style>
</head>
<body>
  <div class="loading-mask" id="loadingMask" role="status" aria-live="polite">
    <div class="loading-box"><span class="spinner" aria-hidden="true"></span><span id="loadingText">正在載入系統資訊...</span></div>
  </div>

  <main class="page">
    <header class="hero">
      <div>
        <div class="eyebrow">系統資源</div>
        <h1>系統監看</h1>
        <p class="subtitle">主機資源趨勢與 Runtime 狀態</p>
      </div>
      <button class="icon-button" type="button" id="refreshButton" title="重新整理" aria-label="重新整理">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-4"></path><path d="M4 4v5h5"></path><path d="M4 13a8 8 0 0 0 14.9 4"></path><path d="M20 20v-5h-5"></path></svg>
      </button>
    </header>

    <nav class="tabs" aria-label="系統監看頁籤">
      <button class="tab active" type="button" data-tab="resources">
        <svg viewBox="0 0 24 24"><path d="M4 19V5"></path><path d="M4 19h16"></path><path d="M8 16v-5"></path><path d="M12 16V8"></path><path d="M16 16v-3"></path></svg>
        資源監看
      </button>
      <button class="tab" type="button" data-tab="details">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1"></rect><rect x="3" y="14" width="18" height="6" rx="1"></rect><path d="M7 7h.01M7 17h.01"></path></svg>
        系統詳細資訊
      </button>
    </nav>

    <div class="error-banner" id="errorBanner"></div>

    <section class="resources-view active" id="resourcesView">
      <section class="panel">
        <div class="toolbar">
          <div class="toolbar-fields">
            <div class="field">
              <label for="modeSelect">顯示方式</label>
              <select id="modeSelect">
                <option value="day">日</option>
                <option value="week">週</option>
                <option value="month">月</option>
              </select>
            </div>
            <div class="field">
              <label for="dateInput">日期</label>
              <div class="date-control">
                <button class="icon-button" type="button" id="previousDate" title="上一個區間" aria-label="上一個區間">
                  <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
                </button>
                <input type="date" id="dateInput">
                <button class="icon-button" type="button" id="nextDate" title="下一個區間" aria-label="下一個區間">
                  <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="toolbar-status" id="historyStatus">尚未載入採樣資料</div>
        </div>

        <div class="summary-grid">
          <article class="summary-card">
            <div class="summary-label"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"></rect><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"></path></svg>CPU</div>
            <div class="summary-value" id="cpuValue">--</div>
            <div class="summary-note" id="cpuNote">等待採樣</div>
          </article>
          <article class="summary-card">
            <div class="summary-label"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M8 19v2M16 19v2M8 9h8M8 13h4"></path></svg>GPU</div>
            <div class="summary-value" id="gpuValue">--</div>
            <div class="summary-note" id="gpuNote">尚未偵測</div>
          </article>
          <article class="summary-card">
            <div class="summary-label"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"></rect><path d="M7 9v6M10 9v6M13 9v6M16 9v6M2 10h2M20 10h2M2 14h2M20 14h2"></path></svg>記憶體</div>
            <div class="summary-value" id="memoryValue">--</div>
            <div class="summary-note" id="memoryNote">等待採樣</div>
          </article>
          <article class="summary-card">
            <div class="summary-label"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 15h.01M11 15h.01M3 11h18"></path></svg>磁碟</div>
            <div class="summary-value" id="diskValue">--</div>
            <div class="summary-note" id="diskNote">等待採樣</div>
          </article>
          <article class="summary-card">
            <div class="summary-label"><svg viewBox="0 0 24 24"><path d="M12 3v14M7 12l5 5 5-5"></path><path d="M5 21h14"></path></svg>網路接收</div>
            <div class="summary-value" id="networkRXValue">--</div>
            <div class="summary-note">所選區間最新速率</div>
          </article>
          <article class="summary-card">
            <div class="summary-label"><svg viewBox="0 0 24 24"><path d="M12 21V7M7 12l5-5 5 5"></path><path d="M5 3h14"></path></svg>網路傳送</div>
            <div class="summary-value" id="networkTXValue">--</div>
            <div class="summary-note">所選區間最新速率</div>
          </article>
        </div>

        <div class="chart-grid">
          <section class="chart-section">
            <div class="chart-heading"><div><div class="chart-title">CPU Usage</div><div class="chart-note">所選區間平均使用率</div></div><div class="legend" style="color:var(--blue)"><button class="legend-item" type="button" data-series="cpu" aria-pressed="true"><span class="legend-dot"></span>CPU</button></div></div>
            <div class="chart-wrap"><canvas id="cpuChart"></canvas><div class="chart-empty" id="cpuChartEmpty">所選區間尚無資料</div></div>
          </section>
          <section class="chart-section">
            <div class="chart-heading"><div><div class="chart-title">GPU Usage</div><div class="chart-note">可辨識 GPU 裝置的平均使用率</div></div><div class="legend" style="color:var(--magenta)"><button class="legend-item" type="button" data-series="gpu" aria-pressed="true"><span class="legend-dot"></span>GPU</button></div></div>
            <div class="chart-wrap"><canvas id="gpuChart"></canvas><div class="chart-empty" id="gpuChartEmpty">尚未偵測到 GPU 使用率</div></div>
          </section>
          <section class="chart-section">
            <div class="chart-heading"><div><div class="chart-title">Memory Usage</div><div class="chart-note">所選區間平均使用率</div></div><div class="legend" style="color:var(--green)"><button class="legend-item" type="button" data-series="memory" aria-pressed="true"><span class="legend-dot"></span>記憶體</button></div></div>
            <div class="chart-wrap"><canvas id="memoryChart"></canvas><div class="chart-empty" id="memoryChartEmpty">所選區間尚無資料</div></div>
          </section>
          <section class="chart-section">
            <div class="chart-heading"><div><div class="chart-title">Disk Usage</div><div class="chart-note">所選區間平均使用率</div></div><div class="legend" style="color:var(--amber)"><button class="legend-item" type="button" data-series="disk" aria-pressed="true"><span class="legend-dot"></span>磁碟</button></div></div>
            <div class="chart-wrap"><canvas id="diskChart"></canvas><div class="chart-empty" id="diskChartEmpty">所選區間尚無資料</div></div>
          </section>
          <section class="chart-section">
            <div class="chart-heading"><div><div class="chart-title">網路流量</div><div class="chart-note">每秒接收與傳送位元組數</div></div><div class="legend"><button class="legend-item" type="button" data-series="rx" aria-pressed="true" style="color:var(--cyan)"><span class="legend-dot"></span>接收</button><button class="legend-item" type="button" data-series="tx" aria-pressed="true" style="color:var(--red)"><span class="legend-dot"></span>傳送</button></div></div>
            <div class="chart-wrap"><canvas id="networkChart"></canvas><div class="chart-empty" id="networkChartEmpty">所選區間尚無資料</div></div>
          </section>
        </div>
      </section>
    </section>

    <section class="details-view" id="detailsView">
      <div class="details-actions"><button class="icon-button" type="button" id="refreshDetailsButton" title="重新整理詳細資訊" aria-label="重新整理詳細資訊"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-4"></path><path d="M4 4v5h5"></path><path d="M4 13a8 8 0 0 0 14.9 4"></path><path d="M20 20v-5h-5"></path></svg></button></div>
      <div class="details-grid" id="detailsGrid"></div>
    </section>
  </main>

  <script>
    const state = {
      tab: "resources",
      mode: "day",
      date: localDateString(new Date()),
      usage: null,
      details: null,
      loading: 0,
      resizeTimer: null,
      seriesVisible: { cpu: true, gpu: true, memory: true, disk: true, rx: true, tx: true }
    };

    const colors = {
      cpu: "#216e9f",
      gpu: "#b84469",
      memory: "#2e865f",
      disk: "#b07820",
      rx: "#247b86",
      tx: "#a33a3a"
    };

    const elements = {
      loadingMask: document.getElementById("loadingMask"),
      loadingText: document.getElementById("loadingText"),
      errorBanner: document.getElementById("errorBanner"),
      resourcesView: document.getElementById("resourcesView"),
      detailsView: document.getElementById("detailsView"),
      modeSelect: document.getElementById("modeSelect"),
      dateInput: document.getElementById("dateInput"),
      nextDate: document.getElementById("nextDate"),
      historyStatus: document.getElementById("historyStatus"),
      detailsGrid: document.getElementById("detailsGrid")
    };

    function localDateString(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseLocalDate(value) {
      const [year, month, day] = String(value).split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showLoading(message) {
      state.loading += 1;
      elements.loadingText.textContent = message || "正在載入系統資訊...";
      elements.loadingMask.classList.add("visible");
    }

    function hideLoading() {
      state.loading = Math.max(0, state.loading - 1);
      if (!state.loading) elements.loadingMask.classList.remove("visible");
    }

    function showError(message) {
      elements.errorBanner.textContent = message || "系統資訊載入失敗";
      elements.errorBanner.classList.add("visible");
    }

    function clearError() {
      elements.errorBanner.classList.remove("visible");
      elements.errorBanner.textContent = "";
    }

    async function apiFetch(path) {
      const response = await fetch(path, { credentials: "same-origin", cache: "no-store" });
      if (response.status === 401) {
        window.parent?.postMessage({ type: "lbp-session-expired" }, window.location.origin);
      }
      let payload = null;
      try { payload = await response.json(); } catch (_) {}
      if (!response.ok) {
        throw new Error(payload?.error?.message || payload?.message || `HTTP ${response.status}`);
      }
      return payload;
    }

    async function loadUsage(options = {}) {
      const silent = options.silent === true;
      if (!silent) showLoading("正在讀取資源採樣資料...");
      clearError();
      try {
        const params = new URLSearchParams({ date: state.date, mode: state.mode });
        state.usage = await apiFetch(`api/system/resources/usage?${params}`);
        renderUsage();
      } catch (error) {
        showError(error.message);
      } finally {
        if (!silent) hideLoading();
      }
    }

    async function loadDetails(options = {}) {
      const silent = options.silent === true;
      if (!silent) showLoading("正在取得系統詳細資訊...");
      clearError();
      try {
        state.details = await apiFetch("api/system/resources/details");
        renderDetails();
      } catch (error) {
        showError(error.message);
      } finally {
        if (!silent) hideLoading();
      }
    }

    function formatPercent(value, available = true) {
      return available && Number.isFinite(Number(value)) ? `${Number(value).toFixed(1)}%` : "--";
    }

    function formatBytes(value) {
      const bytes = Number(value);
      if (!Number.isFinite(bytes) || bytes < 0) return "--";
      const units = ["B", "KiB", "MiB", "GiB", "TiB"];
      let index = 0;
      let display = bytes;
      while (display >= 1024 && index < units.length - 1) {
        display /= 1024;
        index += 1;
      }
      const precision = display >= 100 ? 0 : display >= 10 ? 1 : 2;
      return `${display.toFixed(precision)} ${units[index]}`;
    }

    function formatRate(value) {
      const formatted = formatBytes(value);
      return formatted === "--" ? "--" : `${formatted}/s`;
    }

    function renderUsage() {
      const usage = state.usage || {};
      const latest = usage.latest;
      const hasLatest = Boolean(latest);
      setText("cpuValue", formatPercent(latest?.cpu_percent, hasLatest));
      setText("cpuNote", hasLatest ? `採樣 ${new Date(latest.timestamp).toLocaleTimeString(window.LBPI18n?.locale() || "zh-TW", { hour12: false })}` : "等待採樣");
      setText("gpuValue", formatPercent(latest?.gpu_used_percent, Boolean(latest?.gpu_available)));
      setText("gpuNote", latest?.gpu_available ? `${latest.gpu_source || "GPU"} · ${latest.gpu_device_count || 1} 個裝置` : "尚未偵測");
      setText("memoryValue", formatPercent(latest?.memory_used_percent, hasLatest));
      setText("memoryNote", hasLatest ? `${formatBytes(latest.memory_used_bytes)} / ${formatBytes(latest.memory_total_bytes)}` : "等待採樣");
      setText("diskValue", formatPercent(latest?.disk_used_percent, hasLatest));
      setText("diskNote", hasLatest ? `${formatBytes(latest.disk_used_bytes)} / ${formatBytes(latest.disk_total_bytes)}` : "等待採樣");
      setText("networkRXValue", hasLatest ? formatRate(latest.net_rx_bytes_per_sec) : "--");
      setText("networkTXValue", hasLatest ? formatRate(latest.net_tx_bytes_per_sec) : "--");

      const range = usage.range_start === usage.range_end ? usage.range_start : `${usage.range_start} 至 ${usage.range_end}`;
      elements.historyStatus.textContent = `${range || state.date} · ${Number(usage.raw_sample_count || 0).toLocaleString(window.LBPI18n?.locale() || "zh-TW")} 筆原始採樣 · ${usage.bucket_seconds || 300} 秒統計區間 · 保留 ${usage.retention_days || 90} 天`;
      elements.nextDate.disabled = state.date >= localDateString(new Date());
      drawAllCharts();
    }

    function setText(id, value) {
      const element = document.getElementById(id);
      if (element) element.textContent = value;
    }

    function drawAllCharts() {
      const points = Array.isArray(state.usage?.points) ? state.usage.points : [];
      drawChart("cpuChart", "cpuChartEmpty", points, visibleSeries([{ id: "cpu", key: "cpu_percent", color: colors.cpu }]), { percent: true });
      drawChart("gpuChart", "gpuChartEmpty", points, visibleSeries([{ id: "gpu", key: "gpu_used_percent", color: colors.gpu, available: point => point.gpu_available }]), { percent: true });
      drawChart("memoryChart", "memoryChartEmpty", points, visibleSeries([{ id: "memory", key: "memory_used_percent", color: colors.memory }]), { percent: true });
      drawChart("diskChart", "diskChartEmpty", points, visibleSeries([{ id: "disk", key: "disk_used_percent", color: colors.disk }]), { percent: true });
      drawChart("networkChart", "networkChartEmpty", points, visibleSeries([
        { id: "rx", key: "net_rx_bytes_per_sec", color: colors.rx },
        { id: "tx", key: "net_tx_bytes_per_sec", color: colors.tx }
      ]), { percent: false, byteRate: true });
    }

    function visibleSeries(series) {
      return series.filter(item => state.seriesVisible[item.id] !== false);
    }

    function drawChart(canvasId, emptyId, points, series, options) {
      const canvas = document.getElementById(canvasId);
      const empty = document.getElementById(emptyId);
      const rect = canvas.parentElement.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      const context = canvas.getContext("2d");
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      const width = rect.width;
      const height = rect.height;
      const padding = { top: 12, right: 18, bottom: 30, left: 55 };
      const plotWidth = Math.max(1, width - padding.left - padding.right);
      const plotHeight = Math.max(1, height - padding.top - padding.bottom);
      const hasData = points.some(point => Number(point.sample_count) > 0 && series.some(item => (!item.available || item.available(point)) && Number.isFinite(Number(point[item.key]))));
      empty.classList.toggle("visible", !hasData);

      context.clearRect(0, 0, width, height);
      context.strokeStyle = "#e5e5e5";
      context.fillStyle = "#747474";
      context.font = "11px system-ui, sans-serif";
      context.lineWidth = 1;

      let maxValue = options.percent ? 100 : 0;
      if (!options.percent) {
        points.forEach(point => series.forEach(item => {
          if (Number(point.sample_count) > 0) maxValue = Math.max(maxValue, Number(point[item.key]) || 0);
        }));
        maxValue = niceMaximum(maxValue);
      }

      for (let index = 0; index <= 4; index += 1) {
        const y = padding.top + plotHeight * index / 4;
        context.beginPath();
        context.moveTo(padding.left, y);
        context.lineTo(width - padding.right, y);
        context.stroke();
        const value = maxValue * (1 - index / 4);
        context.textAlign = "right";
        context.textBaseline = "middle";
        context.fillText(options.percent ? `${Math.round(value)}%` : compactRate(value), padding.left - 9, y);
      }

      const labelIndexes = chartLabelIndexes(points.length);
      labelIndexes.forEach(index => {
        const x = padding.left + plotWidth * (points.length <= 1 ? 0 : index / (points.length - 1));
        context.textAlign = index === 0 ? "left" : index === points.length - 1 ? "right" : "center";
        context.textBaseline = "top";
        context.fillText(points[index]?.time || "", x, height - padding.bottom + 9);
      });

      const cellWidth = plotWidth / Math.max(1, points.length);
      const groupWidth = Math.max(1, Math.min(16, cellWidth * 0.82));
      const barGap = series.length > 1 && groupWidth >= 4 ? 1 : 0;
      const barWidth = Math.max(0.7, (groupWidth - barGap * (series.length - 1)) / Math.max(1, series.length));
      const baseline = padding.top + plotHeight;

      series.forEach((item, seriesIndex) => {
        context.fillStyle = item.color;
        points.forEach((point, index) => {
          const valid = Number(point.sample_count) > 0 && (!item.available || item.available(point));
          const value = Number(point[item.key]);
          if (!valid || !Number.isFinite(value)) {
            return;
          }
          const normalized = Math.min(maxValue, Math.max(0, value)) / Math.max(1, maxValue);
          const barHeight = normalized > 0 ? Math.max(1, plotHeight * normalized) : 0;
          const groupStart = padding.left + index * cellWidth + (cellWidth - groupWidth) / 2;
          const x = groupStart + seriesIndex * (barWidth + barGap);
          context.fillRect(x, baseline - barHeight, barWidth, barHeight);
        });
      });
    }

    function niceMaximum(value) {
      if (!Number.isFinite(value) || value <= 0) return 1024;
      const magnitude = 10 ** Math.floor(Math.log10(value));
      return Math.ceil(value / magnitude) * magnitude;
    }

    function compactRate(value) {
      if (value >= 1024 ** 3) return `${(value / 1024 ** 3).toFixed(1)}G`;
      if (value >= 1024 ** 2) return `${(value / 1024 ** 2).toFixed(1)}M`;
      if (value >= 1024) return `${(value / 1024).toFixed(0)}K`;
      return String(Math.round(value));
    }

    function chartLabelIndexes(length) {
      if (!length) return [];
      const count = Math.min(7, length);
      return [...new Set(Array.from({ length: count }, (_, index) => Math.round(index * (length - 1) / Math.max(1, count - 1))))];
    }

    function renderDetails() {
      const data = state.details || {};
      const system = data.system || {};
      const cpu = data.cpu || {};
      const memory = data.memory || {};
      const gpu = data.gpu || {};
      const runtimes = Array.isArray(data.runtimes) ? data.runtimes : [];
      const disks = Array.isArray(data.disks) ? data.disks : [];
      const interfaces = Array.isArray(data.network_interfaces) ? data.network_interfaces : [];
      const temperatures = Array.isArray(data.temperatures) ? data.temperatures : [];

      elements.detailsGrid.innerHTML = [
        detailsCard("主機資訊", [
          ["主機名稱", system.hostname], ["作業系統", [system.platform, system.platform_version].filter(Boolean).join(" ")],
          ["核心", system.kernel_version], ["架構", system.kernel_arch], ["執行時間", formatDuration(system.uptime_seconds)],
          ["開機時間", formatDateTime(system.boot_time)], ["程序數", system.process_count]
        ]),
        detailsCard("CPU", [
          ["型號", cpu.model_name], ["廠商", cpu.vendor_id], ["實體核心", cpu.physical_cores],
          ["邏輯核心", cpu.logical_cores], ["頻率", cpu.mhz ? `${Number(cpu.mhz).toFixed(0)} MHz` : "--"],
          ["封裝數", Array.isArray(cpu.packages) ? cpu.packages.length : 0]
        ]),
        detailsCard("記憶體", [
          ["實體記憶體", `${formatBytes(memory.used_bytes)} / ${formatBytes(memory.total_bytes)}`],
          ["使用率", formatPercent(memory.used_percent, Number.isFinite(Number(memory.used_percent)))],
          ["可用", formatBytes(memory.available_bytes)], ["Swap", `${formatBytes(memory.swap_used_bytes)} / ${formatBytes(memory.swap_total_bytes)}`],
          ["Swap 使用率", formatPercent(memory.swap_used_percent, Number.isFinite(Number(memory.swap_used_percent)))]
        ]),
        detailsCard("GPU 與 Runtime", [
          ["GPU", gpu.available ? `${gpu.device_count || 1} 個裝置` : "未偵測"],
          ["GPU 使用率", formatPercent(gpu.used_percent, gpu.available)], ["GPU 來源", gpu.source || "--"],
          ...runtimes.map(runtime => [runtime.name || "Runtime", runtime.available ? runtime.version || "可用" : "未安裝"])
        ]),
        tableCard("磁碟", ["裝置", "掛載點", "格式", "使用率", "使用量"], disks.map(item => [
          item.device || "--", item.mountpoint || "--", item.filesystem || "--",
          item.available ? formatPercent(item.used_percent) : "--",
          item.available ? `${formatBytes(item.used_bytes)} / ${formatBytes(item.total_bytes)}` : item.error || "--"
        ])),
        tableCard("網路介面", ["名稱", "MAC", "MTU", "位址"], interfaces.map(item => [
          item.name || "--", item.hardware_address || "--", item.mtu ?? "--", Array.isArray(item.addresses) ? item.addresses.join(", ") : "--"
        ])),
        tableCard("溫度感測器", ["感測器", "目前", "高溫", "臨界"], temperatures.map(item => [
          item.name || "--", degree(item.temperature), degree(item.high), degree(item.critical)
        ]))
      ].join("");
    }

    function detailsCard(title, rows) {
      return `<section class="details-card"><header class="details-card-header">${escapeHtml(title)}</header><div class="kv-list">${rows.map(([key, value]) => `<div class="kv-row"><span class="kv-key">${escapeHtml(key)}</span><span class="kv-value">${escapeHtml(displayValue(value))}</span></div>`).join("")}</div></section>`;
    }

    function tableCard(title, headers, rows) {
      const body = rows.length
        ? rows.map(row => `<tr>${row.map(value => `<td>${escapeHtml(displayValue(value))}</td>`).join("")}</tr>`).join("")
        : `<tr><td class="empty-row" colspan="${headers.length}">無相關資訊</td></tr>`;
      return `<section class="details-card wide"><header class="details-card-header">${escapeHtml(title)}</header><div class="table-wrap"><table><thead><tr>${headers.map(header => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div></section>`;
    }

    function displayValue(value) {
      return value === undefined || value === null || value === "" ? "--" : value;
    }

    function degree(value) {
      return Number(value) ? `${Number(value).toFixed(1)} °C` : "--";
    }

    function formatDateTime(value) {
      if (!value) return "--";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleString(window.LBPI18n?.locale() || "zh-TW", { hour12: false });
    }

    function formatDuration(seconds) {
      const value = Number(seconds);
      if (!Number.isFinite(value)) return "--";
      const days = Math.floor(value / 86400);
      const hours = Math.floor(value % 86400 / 3600);
      const minutes = Math.floor(value % 3600 / 60);
      return `${days} 天 ${hours} 小時 ${minutes} 分鐘`;
    }

    function shiftDate(direction) {
      const date = parseLocalDate(state.date);
      if (state.mode === "month") date.setMonth(date.getMonth() + direction);
      else date.setDate(date.getDate() + direction * (state.mode === "week" ? 7 : 1));
      const today = new Date();
      if (date > today) date.setTime(today.getTime());
      state.date = localDateString(date);
      elements.dateInput.value = state.date;
      void loadUsage();
    }

    async function activateTab(tab) {
      state.tab = tab;
      document.querySelectorAll(".tab").forEach(button => button.classList.toggle("active", button.dataset.tab === tab));
      elements.resourcesView.classList.toggle("active", tab === "resources");
      elements.detailsView.classList.toggle("active", tab === "details");
      if (tab === "details" && !state.details) await loadDetails();
      if (tab === "resources") requestAnimationFrame(drawAllCharts);
    }

    document.querySelectorAll(".tab").forEach(button => button.addEventListener("click", () => void activateTab(button.dataset.tab)));
    document.querySelectorAll(".legend-item[data-series]").forEach(button => {
      button.addEventListener("click", () => {
        const series = button.dataset.series;
        const visible = state.seriesVisible[series] === false;
        state.seriesVisible[series] = visible;
        button.classList.toggle("off", !visible);
        button.setAttribute("aria-pressed", String(visible));
        drawAllCharts();
      });
    });
    document.getElementById("refreshButton").addEventListener("click", () => state.tab === "details" ? loadDetails() : loadUsage());
    document.getElementById("refreshDetailsButton").addEventListener("click", () => loadDetails());
    document.getElementById("previousDate").addEventListener("click", () => shiftDate(-1));
    elements.nextDate.addEventListener("click", () => shiftDate(1));
    elements.modeSelect.addEventListener("change", () => {
      state.mode = elements.modeSelect.value;
      void loadUsage();
    });
    elements.dateInput.addEventListener("change", () => {
      if (!elements.dateInput.value) return;
      state.date = elements.dateInput.value;
      void loadUsage();
    });
    window.addEventListener("resize", () => {
      clearTimeout(state.resizeTimer);
      state.resizeTimer = setTimeout(drawAllCharts, 120);
    });
    window.addEventListener("lbp-language-changed", () => {
      if (state.usage) renderUsage();
      if (state.details) renderDetails();
    });

    elements.dateInput.value = state.date;
    elements.dateInput.max = state.date;
    showLoading("正在載入系統監看資料...");
    Promise.all([loadUsage({ silent: true }), loadDetails({ silent: true })]).finally(hideLoading);

    window.setInterval(() => {
      if (document.visibilityState !== "visible" || state.tab !== "resources" || state.mode !== "day") return;
      if (state.date !== localDateString(new Date())) return;
      void loadUsage({ silent: true });
    }, 10000);
  </script>
</body>
</html>
