<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Proxy 登入</title>
  <script src="i18n.js"></script>
  <style>
    :root {
      --bg: #f7f7f7;
      --panel: #ffffff;
      --line: #dedede;
      --text: #171717;
      --muted: #777777;
      --active: #111111;
      --red: #b44931;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
    }

    .login-card {
      width: min(420px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .08);
    }

    .login-header {
      padding: 28px 28px 18px;
      border-bottom: 1px solid #eeeeee;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #050505;
      color: #fff;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .login-body {
      padding: 24px 28px 28px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    label {
      font-size: 13px;
      font-weight: 800;
    }

    input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      font: inherit;
    }

    button {
      width: 100%;
      height: 44px;
      border: 1px solid var(--active);
      border-radius: 8px;
      background: var(--active);
      color: #fff;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    .message {
      min-height: 22px;
      color: var(--red);
      font-size: 13px;
      margin: 2px 0 16px;
      line-height: 1.5;
    }

    .hint {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <header class="login-header">
      <div class="brand">
        <div class="brand-mark">LP</div>
        <strong>LLM Proxy</strong>
      </div>
      <h1>登入管理介面</h1>
    </header>
    <form class="login-body" id="loginForm">
      <div class="field">
        <label for="account">帳號</label>
        <input id="account" name="account" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <div class="message" id="message"></div>
      <button type="submit" id="loginButton">登入</button>
      <div class="hint">登入後會建立 24 小時有效的臨時 API Key，並以 Cookie 保存。</div>
    </form>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const nextPath = safeNextPath(new URLSearchParams(location.search).get("next"));
    const WEB_SESSION_KEY_STORAGE = "lbp.sessionApiKey";
    button.disabled = true;

    function safeNextPath(value) {
      if (!value || value.includes("://") || value.startsWith("//")) {
        return "main.html";
      }
      return value;
    }

    async function clearSession() {
      localStorage.removeItem(WEB_SESSION_KEY_STORAGE);
      sessionStorage.removeItem(WEB_SESSION_KEY_STORAGE);
      try {
        await fetch("api/logout", {
          method: "POST",
          headers: { Accept: "application/json" },
          credentials: "same-origin",
          cache: "no-store"
        });
      } catch (_err) {
      }
    }

    const initialClearSession = clearSession().finally(() => {
      button.disabled = false;
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      try {
        await initialClearSession;
        await clearSession();
        const response = await fetch("api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          credentials: "same-origin",
          cache: "no-store",
          body: JSON.stringify({
            account: document.getElementById("account").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const text = await response.text();
        const payload = text ? JSON.parse(text) : {};
        if (!response.ok) {
          throw new Error(payload?.error?.message || "登入失敗");
        }
        location.replace(nextPath);
      } catch (err) {
        message.textContent = err.message || "登入失敗";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
